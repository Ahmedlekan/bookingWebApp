namespace: three-tier
replicaCount: 2
image:
  repository: 314146307160.dkr.ecr.us-east-1.amazonaws.com/backend-mern-tier
  tag: "5"
  pullPolicy: Always
imagePullSecrets:
  - name: ecr-registry-secret
container:
  name: backend-mern-tier
  port: 3000
resources:
  requests:
    cpu: "150m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 2
  periodSeconds: 5
readinessProbe:
  httpGet:
    path: /ready
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5
  successThreshold: 1
startupProbe:
  httpGet:
    path: /started
    port: 3000
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 30

# Service configuration
service:
  name: api
  type: ClusterIP
  port: 3000
  targetPort: 3000
  protocol: TCP

# ConfigMap data
configMap:
  name: backend-config
  data:
    PORT: "3000"
    FRONTEND_URL: "http://localhost:3000"
    CLOUDINARY_CLOUD_NAME: "dnodnzm2p"
    CLOUDINARY_API_KEY: "295124719844263"

# Secret references (secrets should be created separately)
secrets:
  name: backend-secrets
  keys:
    - MONGO_CONNECTION_STRING
    - JWT_SECRET_KEY
    - CLOUDINARY_API_SECRET
    - STRIPE_API_KEY

# Labels
labels:
  role: api
  env: dev
